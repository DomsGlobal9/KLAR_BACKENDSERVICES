name: CI

on:
  push:
    branches: [main, 'feat/ci-cd']
  pull_request:
    branches: [main]

# No secrets are used: the database tests spawn child processes with fake
# connection strings and never open a socket to Supabase.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
